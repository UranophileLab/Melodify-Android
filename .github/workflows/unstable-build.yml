permissions:
  contents: write

name: Android Unstable Build

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          fi

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --no-daemon --warning-mode none -x lint -x test

      - name: Prepare APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk out/app-unstable.apk

      - name: Create/Update Unstable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unstable
          name: Unstable Build (Pre-Release)
          prerelease: true 
          body: |
            ⚠️ This is an **unstable build**.

            - Built from latest commit on `master`
            - May contain bugs or incomplete features
            - Not recommended for daily use

            Commit: ${{ github.sha }}
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}