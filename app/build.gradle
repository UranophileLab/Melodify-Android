plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    id 'kotlin-kapt'
}

android {
    namespace 'dev.melodify.uranophilelab'
    compileSdk 37

    defaultConfig {
        applicationId "dev.melodify.uranophilelab"
        minSdk 24
        targetSdk 36
        versionCode 13
        versionName '5.3.0'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        //Universal APK Supporting All ABIs
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    packaging {
        jniLibs {
            // Avoid duplicate native library conflicts from ffmpeg-kit
            pickFirsts += ['lib/armeabi-v7a/libavcodec.so',
                           'lib/arm64-v8a/libavcodec.so',
                           'lib/x86/libavcodec.so',
                           'lib/x86_64/libavcodec.so']
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs (for IzzyOnDroid/F-Droid)
        includeInApk = false
    }


    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH") ?: (project.hasProperty("KEYSTORE_PATH") ? project.property("KEYSTORE_PATH") : "release.jks")
            def ksFile = file(ksPath)
            if (!ksFile.exists()) {
                ksFile = file("app/${ksPath}")
            }
            if (!ksFile.exists()) {
                ksFile = file("my-release-key.jks")
            }
            if (!ksFile.exists()) {
                ksFile = file("app/my-release-key.jks")
            }

            storeFile ksFile
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: (project.hasProperty("KEYSTORE_PASSWORD") ? project.property("KEYSTORE_PASSWORD") : "")
            keyAlias System.getenv("KEY_ALIAS") ?: (project.hasProperty("KEY_ALIAS") ? project.property("KEY_ALIAS") : "")
            keyPassword System.getenv("KEY_PASSWORD") ?: (project.hasProperty("KEY_PASSWORD") ? project.property("KEY_PASSWORD") : "")
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    viewBinding {
        enabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            def outputFileName = "Melodify-${variant.versionName}-${variant.name}.apk"
            output.outputFileName = outputFileName
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.core.ktx

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    //FOR LAYOUT DIMENSIONS
    implementation libs.ssp.android
    implementation libs.sdp.android

    //FOR APIs REQUEST AND RESPONSE PARSING
    implementation libs.gson
    implementation libs.okhttp.v4120

    implementation libs.logging.interceptor

    //FOR SHIMMERING LAYOUT (LOADING LAYOUT)
    implementation libs.shimmer

    //PULL TO REFRESH LAYOUT
    implementation libs.swiperefreshlayout

    // MediaSessionCompat and related media classes
    implementation libs.media

    //IMAGE LOADING LIBRARIES
    implementation libs.glide
    kapt libs.compiler

    //IOS STYLE OVERSCROLL EFFECT
    implementation libs.overscroll.decor.android

    implementation libs.core

    implementation libs.palette

    //TRACK PLAYER / AUDIO PLAYER
    implementation libs.bundles.media3Exoplayer

    //Animated Sliding Drawer
    implementation libs.slidingrootnav

    // PAGING LIBRARY FOR RECYCLERVIEW
    implementation libs.paginate

    // FOR TAGGING METADATA INTO MP3 FILES
    implementation libs.jaudiotagger

    // FFMPEG FOR AUDIO TRANSCODING (MP3/OGG conversion)
    implementation libs.ffmpeg.kit.audio
    implementation libs.kotlinx.coroutines.android

    // LOCAL DATABASE FOR CACHING DATA
    implementation libs.room.runtime
    kapt libs.room.compiler

    implementation project(':lrclib')

    // HIDDEN API EXEMPTIONS FOR ANDROID P+
    implementation libs.hiddenapibypass
}
